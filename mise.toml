[tools]
go = "1.26.2"
"go:gitlab.com/backbone/changelog/cmd/changelog" = "v1.1.0"
ginkgo = "2.28.1"
"go:github.com/axw/gocov/gocov" = "v1.1.0"
"go:github.com/AlekSi/gocov-xml" = "v1.2.0"
golangci-lint = "2.8.0"
oapi-codegen = "v2.6.0"

[settings]
# The go backend is experimental
experimental = true
fetch_remote_versions_timeout = "30s"
pin = true
