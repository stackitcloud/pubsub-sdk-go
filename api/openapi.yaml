# For details see https://spec.openapis.org/oas/v3.0.3.html
openapi: 3.0.3
info:
  version: 1beta.0.0
  title: STACKIT PubSub Data Plane API
  description: |
    This API provides endpoints for managing PubSubs.

servers:
  - url: https://{topicId}.pubsub.eu01.onstackit.cloud
    description: Production endpoint in eu01.
    variables:
      topicId:
        description: The Topic UUID.
        default: "00000000-0000-0000-0000-000000000000"

paths:
  /v1beta/publish:
    post:
      operationId: publish-messages
      description: Publish messages within a topic.
      tags:
        - topics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publishMessageToTopicRequest'
      responses:
        '200':
          description: Messages have been published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publishMessageResponse'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '413':
          $ref: '#/components/responses/requestEntityTooLarge'
        '500':
          $ref: '#/components/responses/internalServerError'
        '502':
          $ref: '#/components/responses/badGateway'
        '503':
          $ref: '#/components/responses/serviceUnavailable'
        '504':
          $ref: '#/components/responses/gatewayTimeout'
  /v1beta/purge:
    post:
      operationId: purge-topic
      description: Purge all messages within a topic without deleting the topic itself.
      tags:
        - topics
      responses:
        '204':
          description: Topic has been purged successfully.
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '500':
          $ref: '#/components/responses/internalServerError'
        '502':
          $ref: '#/components/responses/badGateway'
        '503':
          $ref: '#/components/responses/serviceUnavailable'
        '504':
          $ref: '#/components/responses/gatewayTimeout'

  /v1beta/subscriptions/{subscriptionId}/pull:
    parameters:
      - $ref: '#/components/parameters/subscriptionId'
    post:
      operationId: pull-messages
      description: Pull messages within a topic.
      tags:
        - subscriptions
      parameters:
        - name: PubSub-Max-Messages
          in: header
          description: The maximum number of messages to pull.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 32
            default: 16
        - name: PubSub-Long-Pull-Duration
          in: header
          description: The maximum amount of milliseconds to keep an connection open, awaiting a new message on the server.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 100
            maximum: 5000
            default: 5000
      responses:
        '200':
          description: Messages pulled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '500':
          $ref: '#/components/responses/internalServerError'
        '502':
          $ref: '#/components/responses/badGateway'
        '503':
          $ref: '#/components/responses/serviceUnavailable'
        '504':
          $ref: '#/components/responses/gatewayTimeout'
  /v1beta/subscriptions/{subscriptionId}/ack:
    parameters:
      - $ref: '#/components/parameters/subscriptionId'
    post:
      operationId: ack-messages
      description: Acknowledge messages within a topic.
      tags:
        - subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ackMessagesFromTopicRequest'
      responses:
        '204':
          description: Messages have been acknowledged.
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '500':
          $ref: '#/components/responses/internalServerError'
        '502':
          $ref: '#/components/responses/badGateway'
        '503':
          $ref: '#/components/responses/serviceUnavailable'
        '504':
          $ref: '#/components/responses/gatewayTimeout'
  /v1beta/subscriptions/{subscriptionId}/nack:
    parameters:
      - $ref: '#/components/parameters/subscriptionId'
    post:
      operationId: nack-messages
      description: Not acknowledging messages within a topic.
      tags:
        - subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/nackMessagesFromTopicRequest'
      responses:
        '204':
          description: Messages have been not acknowledged.
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '500':
          $ref: '#/components/responses/internalServerError'
        '502':
          $ref: '#/components/responses/badGateway'
        '503':
          $ref: '#/components/responses/serviceUnavailable'
        '504':
          $ref: '#/components/responses/gatewayTimeout'
components:
  parameters:
    subscriptionId:
      name: subscriptionId
      description: The Subscription UUID.
      schema:
        type: string
        format: uuid
      in: path
      required: true
  responses:
    badRequest: # HTTP 400
      description: Bad Request. The data provided by the client did not match expectations.
    unauthorized: # HTTP 401
      description: Unauthorized. You may have provided no or wrong credentials.
    notFound: # HTTP 404
      description: Not found. The resource has not been found.
    requestEntityTooLarge: # HTTP 413
      description: Request Entity Too Large. The payload size exceeds the maximum allowed limit.
    internalServerError: # HTTP 500
      description: Internal server error. The application experienced some unexpected situation.
    badGateway: # HTTP 502
      description: Bad Gateway. The server encountered an error while communicating with a backend service.
    serviceUnavailable: # HTTP 503
      description: Service Unavailable. The service is temporarily unable to handle the request.
    gatewayTimeout: # HTTP 504
      description: Gateway Timeout. The request to a backend service timed out.
  schemas:
    publishMessage:
      required:
        - data
      properties:
        data:
          type: string
          format: byte
          description: Base64 encoded message payload.
    publishMessageToTopicRequest:
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/publishMessage'
          description: The messages to publish.
    publishMessageResponse:
      required:
        - messageIds
      properties:
        messageIds:
          type: array
          items:
            type: integer
            format: uint64
            description: A list of unique, increasing sequence numbers identifying the messages.
    messages:
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/message'
    message:
      required:
        - id
        - ackId
        - data
        - createTime
        - deliveryAttempts
      properties:
        id:
          type: integer
          format: uint64
          description: A unique, increasing sequence number identifying the message within the topic.
        ackId:
          type: string
          description: An auto generated unique id for acknowledging the message.
        data:
          type: string
          format: byte
          description: Base64 encoded messages.
        createTime:
          type: string
          format: date-time
          description: The point in time the resource was created.
        deliveryAttempts:
          type: integer
          format: uint64
          minimum: 1
          description: Number of times the message has been tried to be delivered.
    ackMessagesFromTopicRequest:
      required:
        - ackIds
      properties:
        ackIds:
          type: array
          items:
            type: string
          description: List of ids to acknowledge.
    nackMessagesFromTopicRequest:
      required:
        - nackIds
      properties:
        nackIds:
          type: array
          items:
            type: string
          description: List of ids to not acknowledge.
